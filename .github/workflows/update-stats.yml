name: Update Stats SVG

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Collect all data
        id: data
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, subprocess, os

          token = os.environ["GITHUB_TOKEN"]
          owner = os.environ["OWNER"]

          def api_get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0",
                  "Authorization": f"token {token}",
              })
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          # Fetch user profile
          profile = api_get(f"https://api.github.com/users/{owner}")

          # Fetch all repos
          repos = []
          page = 1
          while True:
              data = api_get(f"https://api.github.com/users/{owner}/repos?per_page=100&page={page}&type=owner")
              if not data:
                  break
              repos.extend(data)
              page += 1

          total_stars = sum(r["stargazers_count"] for r in repos)
          total_forks = sum(r["forks_count"] for r in repos)

          # Top 5 repos by stars
          top_repos = sorted(repos, key=lambda x: -x["stargazers_count"])[:5]
          top_repos_data = [{"name": r["name"], "stars": r["stargazers_count"],
                             "lang": r.get("language") or ""} for r in top_repos]

          # Clone repos and count lines with cloc
          clone_dir = os.path.join(os.environ["RUNNER_TEMP"], "repos")
          os.makedirs(clone_dir, exist_ok=True)

          SKIP_LANGS = {"Text", "C/C++ Header", "Markdown", "JSON", "YAML", "TOML",
                         "XML", "HTML", "CSS", "INI", "SQL", "SVG", "Dockerfile",
                         "make", "Makefile", "CMake", "QMake", "M4", "Gradle",
                         "Maven"}

          LANG_ALIASES = {
              "Bourne Again Shell": "Shell",
              "Bourne Shell": "Shell",
              "POSIX Shell": "Shell",
          }

          lang_lines = {}
          total_code_lines = 0
          total_comment_lines = 0
          for r in repos:
              clone_url = r["clone_url"]
              repo_dir = os.path.join(clone_dir, r["name"])
              auth_url = clone_url.replace("https://", f"https://{token}@")
              subprocess.run(["git", "clone", "--depth=1", auth_url, repo_dir],
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

              result = subprocess.run(
                  ["cloc", repo_dir, "--json", "--quiet", "--not-match-d=vendor,node_modules,.git"],
                  capture_output=True, text=True
              )
              try:
                  cloc_data = json.loads(result.stdout)
              except json.JSONDecodeError:
                  continue

              for lang, info in cloc_data.items():
                  if lang == "SUM":
                      total_code_lines += info.get("code", 0)
                      total_comment_lines += info.get("comment", 0)
                      continue
                  if lang == "header" or lang in SKIP_LANGS:
                      continue
                  code = info.get("code", 0)
                  if code > 0:
                      lang = LANG_ALIASES.get(lang, lang)
                      lang_lines[lang] = lang_lines.get(lang, 0) + code

          sorted_langs = sorted(lang_lines.items(), key=lambda x: -x[1])

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total_stars={total_stars}\n")
              f.write(f"total_forks={total_forks}\n")
              f.write(f"public_repos={profile['public_repos']}\n")
              f.write(f"followers={profile['followers']}\n")
              f.write(f"following={profile['following']}\n")
              f.write(f"created_at={profile['created_at'][:10]}\n")
              f.write(f"total_code_lines={total_code_lines}\n")
              f.write(f"total_comment_lines={total_comment_lines}\n")
              f.write(f"lang_data={json.dumps(sorted_langs)}\n")
              f.write(f"top_repos={json.dumps(top_repos_data)}\n")
          PYEOF
        env:
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate unified SVG
        run: |
          python3 << 'PYEOF'
          import json, os
          from datetime import datetime

          # --- Data ---
          total_stars = int(os.environ["TOTAL_STARS"])
          total_forks = int(os.environ["TOTAL_FORKS"])
          public_repos = int(os.environ["PUBLIC_REPOS"])
          followers = int(os.environ["FOLLOWERS"])
          created_at = os.environ["CREATED_AT"]
          total_code = int(os.environ["TOTAL_CODE_LINES"])
          total_comments = int(os.environ["TOTAL_COMMENT_LINES"])
          lang_data = json.loads(os.environ["LANG_DATA"])
          top_repos = json.loads(os.environ["TOP_REPOS"])

          created = datetime.strptime(created_at, "%Y-%m-%d")
          years = (datetime.now() - created).days // 365

          def fmt(n):
              if n >= 1000000: return f"{n/1000000:.1f}M"
              if n >= 1000: return f"{n/1000:.1f}K"
              return str(n)

          # --- Layout ---
          col_w = 280
          gap = 16
          padding = 12
          header_h = 32
          col_inner = col_w - 2 * padding

          # Column 1: Profile Stats
          profile_items = [
              ("⭐ Stars", fmt(total_stars)),
              ("🍴 Forks", fmt(total_forks)),
              ("📦 Repos", str(public_repos)),
              ("👥 Followers", str(followers)),
              ("💻 Code Lines", fmt(total_code)),
              ("💬 Comments", fmt(total_comments)),
              ("🎂 GitHub Age", f"{years} yrs"),
          ]
          profile_row_h = 24

          # Column 2: Top Repos
          medal_colors = ["#FFD700", "#C0C0C0", "#CD7F32", "#8b949e", "#8b949e"]
          medals = ["🥇", "🥈", "🥉", "4.", "5."]
          trophy_row_h = 26

          # Column 3: Languages
          LANG_COLORS = {
              "Go": "#00ADD8", "Java": "#b07219", "C++": "#f34b7d",
              "Shell": "#89e051", "C": "#555555", "Python": "#3572A5",
              "JavaScript": "#f1e05a", "TypeScript": "#2b7489", "Rust": "#dea584",
              "Ruby": "#701516", "PHP": "#4F5D95", "Swift": "#F05138",
              "Kotlin": "#A97BFF", "Dart": "#00B4AB", "Scala": "#c22d40",
              "Perl": "#0298c3", "CSS": "#563d7c", "HTML": "#e34c26",
              "Lua": "#000080", "R": "#198CE7", "Dockerfile": "#384d54",
              "Assembly": "#6E4C13", "Batchfile": "#C1F12E", "Visual Basic": "#945db7",
              "CMake": "#DA3434", "Makefile": "#427819", "Vim Script": "#199F4B",
              "LLVM": "#185619", "HCL": "#844FBA", "Nix": "#7E7EFF",
              "QMake": "#A6BCE0", "M4": "#6A6D4F", "Smali": "#2C3E50",
              "Objective-C": "#438eff", "Objective-C++": "#6866fb",
              "m4": "#8b949e",
          }
          top_langs = lang_data[:6]
          total_lang_lines = sum(v for _, v in lang_data)
          lang_row_h = 34

          # Calculate each column's content height
          profile_h = len(profile_items) * profile_row_h
          trophy_h = len(top_repos) * trophy_row_h
          lang_h = len(top_langs) * lang_row_h

          # All columns share the same height (tallest content + header + padding)
          max_content = max(profile_h, trophy_h, lang_h)
          col_h = header_h + max_content + padding

          svg_w = col_w * 3 + gap * 2
          svg_h = col_h + padding * 2
          r = 8  # border radius

          # --- Build SVG ---
          s = []
          s.append(f'<svg xmlns="http://www.w3.org/2000/svg" width="{svg_w}" height="{svg_h}">')
          s.append(f'  <defs>')
          s.append(f'    <style>')
          s.append(f'      .header {{ font: bold 14px "Segoe UI", Arial, sans-serif; fill: #c9d1d9; }}')
          s.append(f'      .label {{ font: 13px "Segoe UI", Arial, sans-serif; fill: #8b949e; }}')
          s.append(f'      .value {{ font: 13px "Segoe UI", Arial, sans-serif; fill: #58a6ff; }}')
          s.append(f'      .lang-name {{ font: 12px "Segoe UI", Arial, sans-serif; fill: #c9d1d9; }}')
          s.append(f'      .lang-pct {{ font: 12px "Segoe UI", Arial, sans-serif; fill: #8b949e; }}')
          s.append(f'      .medal-value {{ font: 13px "Segoe UI", Arial, sans-serif; fill: #8b949e; }}')
          s.append(f'    </style>')
          s.append(f'  </defs>')

          # Background
          s.append(f'  <rect width="{svg_w}" height="{svg_h}" rx="{r}" fill="#0d1117"/>')

          # --- Column 1: Profile Stats ---
          x1 = 0
          s.append(f'  <rect x="{x1}" y="0" width="{col_w}" height="{svg_h}" rx="{r}" fill="#161b22"/>')
          s.append(f'  <text x="{x1 + padding}" y="{padding + 18}" class="header">📊 Profile Stats</text>')
          y = padding + header_h
          for label, value in profile_items:
              s.append(f'  <text x="{x1 + padding}" y="{y + 14}" class="label">{label}</text>')
              s.append(f'  <text x="{x1 + col_w - padding}" y="{y + 14}" class="value" text-anchor="end">{value}</text>')
              y += profile_row_h

          # --- Column 2: Top Repos ---
          x2 = col_w + gap
          s.append(f'  <rect x="{x2}" y="0" width="{col_w}" height="{svg_h}" rx="{r}" fill="#161b22"/>')
          s.append(f'  <text x="{x2 + padding}" y="{padding + 18}" class="header">🏆 Top Repos</text>')
          y = padding + header_h
          for i, repo in enumerate(top_repos):
              color = medal_colors[i]
              medal = medals[i]
              s.append(f'  <text x="{x2 + padding}" y="{y + 14}" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="{color}">{medal} {repo["name"]}</text>')
              s.append(f'  <text x="{x2 + col_w - padding}" y="{y + 14}" class="medal-value" text-anchor="end">⭐ {repo["stars"]}</text>')
              y += trophy_row_h

          # --- Column 3: Top Languages ---
          x3 = (col_w + gap) * 2
          s.append(f'  <rect x="{x3}" y="0" width="{col_w}" height="{svg_h}" rx="{r}" fill="#161b22"/>')
          s.append(f'  <text x="{x3 + padding}" y="{padding + 18}" class="header">💻 Top Languages</text>')
          bar_h = 10
          bar_w = col_inner
          y = padding + header_h
          for lang, code_lines in top_langs:
              pct = code_lines / total_lang_lines * 100 if total_lang_lines else 0
              color = LANG_COLORS.get(lang, "#8b949e")
              filled = int(bar_w * pct / 100)
              s.append(f'  <text x="{x3 + padding}" y="{y + 13}" class="lang-name">{lang}</text>')
              s.append(f'  <text x="{x3 + col_w - padding}" y="{y + 13}" class="lang-pct" text-anchor="end">{pct:.1f}%</text>')
              s.append(f'  <rect x="{x3 + padding}" y="{y + 18}" width="{bar_w}" height="{bar_h}" rx="3" fill="#30363d"/>')
              s.append(f'  <rect x="{x3 + padding}" y="{y + 18}" width="{filled}" height="{bar_h}" rx="3" fill="{color}"/>')
              y += lang_row_h

          s.append('</svg>')

          with open("stats.svg", "w") as f:
              f.write("\n".join(s))
          PYEOF
        env:
          TOTAL_STARS: ${{ steps.data.outputs.total_stars }}
          TOTAL_FORKS: ${{ steps.data.outputs.total_forks }}
          PUBLIC_REPOS: ${{ steps.data.outputs.public_repos }}
          FOLLOWERS: ${{ steps.data.outputs.followers }}
          CREATED_AT: ${{ steps.data.outputs.created_at }}
          TOTAL_CODE_LINES: ${{ steps.data.outputs.total_code_lines }}
          TOTAL_COMMENT_LINES: ${{ steps.data.outputs.total_comment_lines }}
          LANG_DATA: ${{ steps.data.outputs.lang_data }}
          TOP_REPOS: ${{ steps.data.outputs.top_repos }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg profile.svg languages.svg trophy.svg
          git diff --cached --quiet || git commit -m "Update stats SVG [skip ci]"
          git push
