name: Update Stats SVG

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch total stars
        id: stars
        run: |
          TOTAL=0
          PAGE=1
          while true; do
            DATA=$(curl -s "https://api.github.com/users/${{ github.repository_owner }}/repos?per_page=100&page=$PAGE&type=owner")
            COUNT=$(echo "$DATA" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
            if [ "$COUNT" = "0" ]; then
              break
            fi
            STARS=$(echo "$DATA" | python3 -c "import json,sys; print(sum(r['stargazers_count'] for r in json.load(sys.stdin)))")
            TOTAL=$((TOTAL + STARS))
            PAGE=$((PAGE + 1))
          done
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Generate SVG
        run: |
          cat > stats.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="280" height="40">
            <rect width="280" height="40" rx="6" fill="#1b1f23"/>
            <text x="15" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8b949e">Total Stars</text>
            <text x="265" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#58a6ff" text-anchor="end">⭐ ${{ steps.stars.outputs.total }}</text>
          </svg>
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --cached --quiet || git commit -m "Update stats SVG [skip ci]"
          git push
