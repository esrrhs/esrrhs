name: Update Stats SVG

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Collect all data
        id: data
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, subprocess, os

          token = os.environ["GITHUB_TOKEN"]
          owner = os.environ["OWNER"]

          def api_get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0",
                  "Authorization": f"token {token}",
              })
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          # Fetch user profile
          profile = api_get(f"https://api.github.com/users/{owner}")

          # Fetch all repos
          repos = []
          page = 1
          while True:
              data = api_get(f"https://api.github.com/users/{owner}/repos?per_page=100&page={page}&type=owner")
              if not data:
                  break
              repos.extend(data)
              page += 1

          total_stars = sum(r["stargazers_count"] for r in repos)
          total_forks = sum(r["forks_count"] for r in repos)

          # Top 5 repos by stars
          top_repos = sorted(repos, key=lambda x: -x["stargazers_count"])[:5]
          top_repos_data = [{"name": r["name"], "stars": r["stargazers_count"],
                             "lang": r.get("language") or ""} for r in top_repos]

          # Clone repos and count lines with cloc
          clone_dir = os.path.join(os.environ["RUNNER_TEMP"], "repos")
          os.makedirs(clone_dir, exist_ok=True)

          SKIP_LANGS = {"Text", "C/C++ Header", "Markdown", "JSON", "YAML", "TOML",
                         "XML", "HTML", "CSS", "INI", "SQL", "SVG", "Dockerfile",
                         "make", "Makefile", "CMake", "QMake", "M4", "Gradle",
                         "Maven"}

          LANG_ALIASES = {
              "Bourne Again Shell": "Shell",
              "Bourne Shell": "Shell",
              "POSIX Shell": "Shell",
          }

          lang_lines = {}
          total_code_lines = 0
          total_blank_lines = 0
          total_comment_lines = 0
          for r in repos:
              clone_url = r["clone_url"]
              repo_dir = os.path.join(clone_dir, r["name"])
              auth_url = clone_url.replace("https://", f"https://{token}@")
              subprocess.run(["git", "clone", "--depth=1", auth_url, repo_dir],
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

              result = subprocess.run(
                  ["cloc", repo_dir, "--json", "--quiet", "--not-match-d=vendor,node_modules,.git"],
                  capture_output=True, text=True
              )
              try:
                  cloc_data = json.loads(result.stdout)
              except json.JSONDecodeError:
                  continue

              for lang, info in cloc_data.items():
                  if lang == "SUM":
                      total_code_lines += info.get("code", 0)
                      total_blank_lines += info.get("blank", 0)
                      total_comment_lines += info.get("comment", 0)
                      continue
                  if lang == "header" or lang in SKIP_LANGS:
                      continue
                  code = info.get("code", 0)
                  if code > 0:
                      lang = LANG_ALIASES.get(lang, lang)
                      lang_lines[lang] = lang_lines.get(lang, 0) + code

          sorted_langs = sorted(lang_lines.items(), key=lambda x: -x[1])

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total_stars={total_stars}\n")
              f.write(f"total_forks={total_forks}\n")
              f.write(f"public_repos={profile['public_repos']}\n")
              f.write(f"followers={profile['followers']}\n")
              f.write(f"following={profile['following']}\n")
              f.write(f"created_at={profile['created_at'][:10]}\n")
              f.write(f"total_code_lines={total_code_lines}\n")
              f.write(f"total_comment_lines={total_comment_lines}\n")
              f.write(f"lang_data={json.dumps(sorted_langs)}\n")
              f.write(f"top_repos={json.dumps(top_repos_data)}\n")
          PYEOF
        env:
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats SVG
        run: |
          cat > stats.svg <<SVGEOF
          <svg xmlns="http://www.w3.org/2000/svg" width="280" height="40">
            <rect width="280" height="40" rx="6" fill="#1b1f23"/>
            <text x="15" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8b949e">Total Stars</text>
            <text x="265" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#58a6ff" text-anchor="end">⭐ ${{ steps.data.outputs.total_stars }}</text>
          </svg>
          SVGEOF

      - name: Generate languages SVG
        run: |
          python3 << 'PYEOF'
          import json, os

          lang_data = json.loads(os.environ["LANG_DATA"])
          total_lines = sum(v for _, v in lang_data)

          LANG_COLORS = {
              "Go": "#00ADD8", "Java": "#b07219", "C++": "#f34b7d",
              "Shell": "#89e051", "C": "#555555", "Python": "#3572A5",
              "JavaScript": "#f1e05a", "TypeScript": "#2b7489", "Rust": "#dea584",
              "Ruby": "#701516", "PHP": "#4F5D95", "Swift": "#F05138",
              "Kotlin": "#A97BFF", "Dart": "#00B4AB", "Scala": "#c22d40",
              "Perl": "#0298c3", "CSS": "#563d7c", "HTML": "#e34c26",
              "Lua": "#000080", "R": "#198CE7", "Dockerfile": "#384d54",
              "Assembly": "#6E4C13", "Batchfile": "#C1F12E", "Visual Basic": "#945db7",
              "CMake": "#DA3434", "Makefile": "#427819", "Vim Script": "#199F4B",
              "LLVM": "#185619", "HCL": "#844FBA", "Nix": "#7E7EFF",
              "QMake": "#A6BCE0", "M4": "#6A6D4F", "Smali": "#2C3E50",
              "Objective-C": "#438eff", "Objective-C++": "#6866fb",
              "m4": "#8b949e",
          }

          top = lang_data[:6]
          bar_h = 10
          row_h = 34
          svg_h = 40 + len(top) * row_h + 10
          bar_w = 250

          lines = []
          lines.append(f'<svg xmlns="http://www.w3.org/2000/svg" width="280" height="{svg_h}">')
          lines.append(f'  <rect width="280" height="{svg_h}" rx="6" fill="#1b1f23"/>')
          lines.append(f'  <text x="15" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c9d1d9">Top Languages</text>')

          y = 48
          for lang, code_lines in top:
              pct = code_lines / total_lines * 100 if total_lines else 0
              color = LANG_COLORS.get(lang, "#8b949e")
              filled = int(bar_w * pct / 100)
              lines.append(f'  <text x="15" y="{y}" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c9d1d9">{lang}</text>')
              lines.append(f'  <text x="265" y="{y}" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="end">{pct:.1f}%</text>')
              lines.append(f'  <rect x="15" y="{y + 5}" width="{bar_w}" height="{bar_h}" rx="3" fill="#30363d"/>')
              lines.append(f'  <rect x="15" y="{y + 5}" width="{filled}" height="{bar_h}" rx="3" fill="{color}"/>')
              y += row_h

          lines.append('</svg>')

          with open("languages.svg", "w") as f:
              f.write("\n".join(lines))
          PYEOF
        env:
          LANG_DATA: ${{ steps.data.outputs.lang_data }}

      - name: Generate profile SVG
        run: |
          python3 << 'PYEOF'
          import os

          total_stars = os.environ["TOTAL_STARS"]
          total_forks = os.environ["TOTAL_FORKS"]
          public_repos = os.environ["PUBLIC_REPOS"]
          followers = os.environ["FOLLOWERS"]
          following = os.environ["FOLLOWING"]
          created_at = os.environ["CREATED_AT"]
          total_code = os.environ["TOTAL_CODE_LINES"]
          total_comments = os.environ["TOTAL_COMMENT_LINES"]

          from datetime import datetime
          created = datetime.strptime(created_at, "%Y-%m-%d")
          now = datetime.now()
          years = (now - created).days // 365

          def fmt(n):
              n = int(n)
              if n >= 1000000: return f"{n/1000000:.1f}M"
              if n >= 1000: return f"{n/1000:.1f}K"
              return str(n)

          items = [
              ("⭐ Stars", fmt(total_stars)),
              ("🍴 Forks", fmt(total_forks)),
              ("📦 Repos", public_repos),
              ("👥 Followers", followers),
              ("💻 Code Lines", fmt(total_code)),
              ("💬 Comments", fmt(total_comments)),
              ("🎂 GitHub Age", f"{years} yrs"),
          ]

          row_h = 26
          svg_h = 40 + len(items) * row_h + 10
          svg_w = 280

          lines = []
          lines.append(f'<svg xmlns="http://www.w3.org/2000/svg" width="{svg_w}" height="{svg_h}">')
          lines.append(f'  <rect width="{svg_w}" height="{svg_h}" rx="6" fill="#1b1f23"/>')
          lines.append(f'  <text x="15" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c9d1d9">Profile Stats</text>')

          y = 50
          for label, value in items:
              lines.append(f'  <text x="15" y="{y}" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">{label}</text>')
              lines.append(f'  <text x="265" y="{y}" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#58a6ff" text-anchor="end">{value}</text>')
              y += row_h

          lines.append('</svg>')

          with open("profile.svg", "w") as f:
              f.write("\n".join(lines))
          PYEOF
        env:
          TOTAL_STARS: ${{ steps.data.outputs.total_stars }}
          TOTAL_FORKS: ${{ steps.data.outputs.total_forks }}
          PUBLIC_REPOS: ${{ steps.data.outputs.public_repos }}
          FOLLOWERS: ${{ steps.data.outputs.followers }}
          FOLLOWING: ${{ steps.data.outputs.following }}
          CREATED_AT: ${{ steps.data.outputs.created_at }}
          TOTAL_CODE_LINES: ${{ steps.data.outputs.total_code_lines }}
          TOTAL_COMMENT_LINES: ${{ steps.data.outputs.total_comment_lines }}

      - name: Generate trophy SVG
        run: |
          python3 << 'PYEOF'
          import json, os

          top_repos = json.loads(os.environ["TOP_REPOS"])

          row_h = 30
          svg_h = 40 + len(top_repos) * row_h + 10
          svg_w = 280

          medal_colors = ["#FFD700", "#C0C0C0", "#CD7F32", "#8b949e", "#8b949e"]
          medals = ["🥇", "🥈", "🥉", "4.", "5."]

          lines = []
          lines.append(f'<svg xmlns="http://www.w3.org/2000/svg" width="{svg_w}" height="{svg_h}">')
          lines.append(f'  <rect width="{svg_w}" height="{svg_h}" rx="6" fill="#1b1f23"/>')
          lines.append(f'  <text x="15" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c9d1d9">🏆 Top Repos</text>')

          y = 52
          for i, repo in enumerate(top_repos):
              medal = medals[i]
              color = medal_colors[i]
              lines.append(f'  <text x="15" y="{y}" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="{color}">{medal} {repo["name"]}</text>')
              lines.append(f'  <text x="265" y="{y}" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="end">⭐ {repo["stars"]}</text>')
              y += row_h

          lines.append('</svg>')

          with open("trophy.svg", "w") as f:
              f.write("\n".join(lines))
          PYEOF
        env:
          TOP_REPOS: ${{ steps.data.outputs.top_repos }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg languages.svg profile.svg trophy.svg
          git diff --cached --quiet || git commit -m "Update stats SVG [skip ci]"
          git push
